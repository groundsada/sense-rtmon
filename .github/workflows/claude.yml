---
# Conversational Claude on issues and PRs, answering to "@claude".
#
# Runs against NRP's Anthropic-compatible gateway rather than api.anthropic.com,
# so the model is free. No Anthropic API key or subscription token is involved.
#
# Read-only by default: it reviews, labels and proposes diffs in fenced
# suggestion blocks, but does not push. See claude-write.yml to let it open PRs.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # The action re-checks the trigger phrase itself, but only after a runner is
    # already up. Filtering here keeps unrelated comment traffic off the runner.
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    # NRP is a shared gateway; cap the job so a bad run fails visibly.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Reviews need to diff against the base, which a depth-1 clone cannot do.
          #
          # Do NOT add persist-credentials: false. The action's own branch setup
          # runs "git fetch origin <base>", which fails on a private repo without
          # credentials. It only appears to work on public repos, where the fetch
          # succeeds anonymously.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # NRP accepts this as a bearer token. Nothing here bills Anthropic.
          anthropic_api_key: ${{ secrets.NRP_AUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No use_sticky_comment: it matches on claude[bot], but authenticating
          # with GITHUB_TOKEN posts as github-actions[bot], so it never updates
          # an existing comment. Setting it implies behaviour you do not get.

          claude_args: |
            --model glm-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh label list:*),mcp__github_inline_comment__create_inline_comment"

          # Claude Code runs the CLI as a subprocess and settings.env wins over
          # plain process env, so the endpoint is declared in both places.
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://ellm.nrp-nautilus.io/anthropic",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.NRP_AUTH_TOKEN }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "glm-5",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "glm-5",
                "CLAUDE_CODE_SUBAGENT_MODEL": "deepseek-v4-flash",
                "CLAUDE_CODE_AUTO_COMPACT_WINDOW": "200000",
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "16000",
                "API_TIMEOUT_MS": "600000",
                "CLAUDE_STREAM_IDLE_TIMEOUT_MS": "300000",
                "ENABLE_TOOL_SEARCH": "false",
                "DISABLE_TELEMETRY": "1",
                "DISABLE_NON_ESSENTIAL_MODEL_CALLS": "1",
                "CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1"
              }
            }
        env:
          # gh needs this explicitly; the model's Bash calls run outside the
          # action's own authenticated GitHub client.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: https://ellm.nrp-nautilus.io/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.NRP_AUTH_TOKEN }}
          # Load-bearing. NRP serves only its own model names on the Anthropic
          # path, and Claude Code resolves subagents and background tasks through
          # these role variables. Left at defaults they resolve to
          # claude-haiku-4-5 / claude-sonnet-5 / claude-opus-5, every one of those
          # calls 404s, and the run dies partway through.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          # glm-5 holds 300K; 200000 leaves headroom before the gateway 400s on
          # context overflow. It also spends output tokens on reasoning before
          # emitting text, hence the high output cap.
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "200000"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "16000"
          API_TIMEOUT_MS: "600000"
          CLAUDE_STREAM_IDLE_TIMEOUT_MS: "300000"
          # NRP's open-weights models cannot reliably emit the tool-search tool.
          ENABLE_TOOL_SEARCH: "false"
          DISABLE_TELEMETRY: "1"
          DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
